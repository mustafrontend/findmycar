workflows:
  ios-release:
    name: Find My Car iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      groups:
        - appstore_credentials
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.findmycar.parkedlocation" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --warn-only
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-1}
      - name: Build iOS Xcode App
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
